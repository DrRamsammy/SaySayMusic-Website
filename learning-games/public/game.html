<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SaySayMusic Learning Games</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#162033;--muted:#657084;--line:#dfe5ef;--accent:#1f5eff;--accent2:#0f45c9;--good:#16875c;--bad:#c03d3d;--shadow:0 18px 50px rgba(20,35,70,.10)}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#eef3ff 0,#f8f9fc 34%,#f5f7fb 100%);color:var(--ink)}button,select{font:inherit}.shell{max-width:1280px;margin:0 auto;padding:24px}.topbar{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:18px}.brand{display:flex;align-items:center;gap:14px}.brandmark{width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#6f8cff);display:grid;place-items:center;color:#fff;font-weight:800;box-shadow:0 10px 28px rgba(31,94,255,.25)}.brandtext strong{display:block;font-size:20px}.brandtext span{color:var(--muted);font-size:13px}.controls{display:flex;gap:10px;align-items:center}.language{border:1px solid var(--line);background:#fff;padding:10px 12px;border-radius:10px}.hero{background:linear-gradient(135deg,#10265c,#1f5eff);color:#fff;border-radius:24px;padding:24px 28px;box-shadow:var(--shadow);margin-bottom:18px}.crumbs{font-size:13px;opacity:.85;margin-bottom:8px}.hero h1{margin:0;font-size:34px;letter-spacing:-.02em}.hero p{margin:8px 0 0;opacity:.88}.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px}.card{background:var(--card);border:1px solid rgba(223,229,239,.9);border-radius:22px;box-shadow:var(--shadow)}.reading{padding:30px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}.passage{font-size:21px;line-height:1.85}.blank{min-width:120px;display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;border:2px dashed #aeb9ca;background:#f8faff;border-radius:9px;min-height:42px;padding:4px 10px;margin:0 3px;color:var(--ink);transition:.16s}.blank.active{border-color:var(--accent);background:#edf3ff}.blank.correct{border-style:solid;border-color:var(--good);background:#edf9f4}.blank.incorrect{border-style:solid;border-color:var(--bad);background:#fff1f1}.bank{padding:24px;position:sticky;top:16px;height:max-content}.bank h2{margin:0 0 6px;font-size:18px}.bank p{margin:0 0 16px;color:var(--muted);font-size:14px}.words{display:flex;flex-wrap:wrap;gap:10px}.word{border:1px solid #cfd7e5;background:#fff;border-radius:12px;padding:10px 13px;font-weight:700;cursor:grab;box-shadow:0 4px 12px rgba(30,45,75,.06)}.word.selected{outline:3px solid rgba(31,94,255,.2);border-color:var(--accent)}.word.used{display:none}.footer{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:18px 22px;margin-top:18px}.progress{color:var(--muted);font-size:14px}.actions{display:flex;gap:10px}.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:800;cursor:pointer}.btn.secondary{background:#edf1f7;color:#22304b}.btn.primary{background:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent2)}.result{font-weight:800}.result.good{color:var(--good)}.result.bad{color:var(--bad)}@media(max-width:850px){.grid{grid-template-columns:1fr}.bank{position:static}.topbar{align-items:flex-start;flex-direction:column}.passage{font-size:18px}.hero h1{font-size:28px}}@media(max-width:560px){.shell{padding:12px}.reading{padding:20px}.footer{align-items:stretch;flex-direction:column}.actions{display:grid;grid-template-columns:1fr 1fr}.btn{width:100%}}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand"><div class="brandmark">SS</div><div class="brandtext"><strong>SaySayMusic Learning Games</strong><span>Education Through Melody</span></div></div>
    <div class="controls"><select id="language" class="language" aria-label="Language"><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option></select></div>
  </div>
  <section class="hero"><div class="crumbs" id="crumbs"></div><h1 id="title">Cell Membrane</h1><p id="instructions"></p></section>
  <div class="grid">
    <main class="card reading"><div class="eyebrow">Read and complete</div><div id="passage" class="passage"></div></main>
    <aside class="card bank"><h2>Word Bank</h2><p>Drag a word, or tap a word and then tap a blank.</p><div id="words" class="words"></div></aside>
  </div>
  <div class="card footer"><div><div class="progress" id="progress"></div><div id="result" class="result"></div></div><div class="actions"><button class="btn secondary" id="reset">Reset</button><button class="btn primary" id="submit">Submit</button></div></div>
</div>
<script>
const GAME={path:["Biology","Cell","Organelles","Cell Membrane"],languages:{en:{title:"Cell Membrane",instructions:"Drag or tap each word into the blank where it belongs.",passage:"Cell membrane, also called [[plasma]], surrounds every living cell. It contains molecules such as [[proteins]] and participates in [[cellular]] metabolism. It regulates ions, acids and [[alkalis]] and helps the cell live and [[grow]]. The membrane acts as a [[barrier]], keeping [[wanted]] substances inside while also serving as a selective [[gate]].",answers:["plasma","proteins","cellular","alkalis","grow","barrier","wanted","gate"]},es:{title:"Membrana celular",instructions:"Arrastra o toca cada palabra y colócala en el espacio correcto.",passage:"La membrana celular, también llamada membrana [[plasmática]], rodea cada célula viva. Contiene moléculas como [[proteínas]] y participa en el metabolismo [[celular]]. Regula iones, ácidos y [[álcalis]] y ayuda a la célula a vivir y [[crecer]]. La membrana actúa como una [[barrera]], mantiene sustancias [[necesarias]] dentro y también funciona como una [[puerta]] selectiva.",answers:["plasmática","proteínas","celular","álcalis","crecer","barrera","necesarias","puerta"]},fr:{title:"Membrane cellulaire",instructions:"Faites glisser ou touchez chaque mot pour le placer dans l'espace correct.",passage:"La membrane cellulaire, aussi appelée membrane [[plasmique]], entoure chaque cellule vivante. Elle contient des molécules comme les [[protéines]] et participe au métabolisme [[cellulaire]]. Elle régule les ions, les acides et les [[alcalis]] et aide la cellule à vivre et à [[croître]]. La membrane agit comme une [[barrière]], conserve les substances [[nécessaires]] à l'intérieur et fonctionne aussi comme une [[porte]] sélective.",answers:["plasmique","protéines","cellulaire","alcalis","croître","barrière","nécessaires","porte"]}}};
let lang='en',selected=null,placements={};
const $=id=>document.getElementById(id);
function shuffled(a){return [...a].sort(()=>Math.random()-.5)}
function render(){selected=null;placements={};const d=GAME.languages[lang];$('title').textContent=d.title;$('instructions').textContent=d.instructions;$('crumbs').textContent='Learning Games › '+GAME.path.join(' › ');let i=0;$('passage').innerHTML=d.passage.replace(/\[\[(.*?)\]\]/g,(_,answer)=>`<span class="blank" tabindex="0" data-index="${i}" data-answer="${escapeHtml(answer)}" aria-label="Blank ${++i}"></span>`);$('words').innerHTML=shuffled(d.answers).map((w,j)=>`<button class="word" draggable="true" data-word="${escapeHtml(w)}" data-id="w${j}">${escapeHtml(w)}</button>`).join('');wire();updateProgress();$('result').textContent='';}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function wire(){document.querySelectorAll('.word').forEach(w=>{w.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',w.dataset.word));w.addEventListener('click',()=>{document.querySelectorAll('.word').forEach(x=>x.classList.remove('selected'));selected=w.dataset.word;w.classList.add('selected')})});document.querySelectorAll('.blank').forEach(b=>{b.addEventListener('dragover',e=>{e.preventDefault();b.classList.add('active')});b.addEventListener('dragleave',()=>b.classList.remove('active'));b.addEventListener('drop',e=>{e.preventDefault();place(b,e.dataTransfer.getData('text/plain'));b.classList.remove('active')});b.addEventListener('click',()=>{if(selected)place(b,selected)})})}
function place(blank,word){const idx=blank.dataset.index;const old=placements[idx];if(old)showWord(old);placements[idx]=word;blank.textContent=word;blank.classList.remove('correct','incorrect');hideWord(word);selected=null;document.querySelectorAll('.word').forEach(x=>x.classList.remove('selected'));updateProgress()}
function hideWord(word){document.querySelectorAll('.word').forEach(w=>{if(w.dataset.word===word&&!w.classList.contains('used'))w.classList.add('used')})}
function showWord(word){const w=[...document.querySelectorAll('.word')].find(x=>x.dataset.word===word);if(w)w.classList.remove('used')}
function updateProgress(){const total=document.querySelectorAll('.blank').length;const n=Object.keys(placements).length;$('progress').textContent=`${n} of ${total} blanks completed`;}
$('reset').onclick=render;$('language').onchange=e=>{lang=e.target.value;render()};$('submit').onclick=()=>{const blanks=[...document.querySelectorAll('.blank')];let score=0;blanks.forEach(b=>{const ok=(placements[b.dataset.index]||'')===b.dataset.answer;b.classList.toggle('correct',ok);b.classList.toggle('incorrect',!ok);if(ok)score++});const pct=Math.round(score/blanks.length*100);$('result').textContent=`Score: ${score}/${blanks.length} (${pct}%)`;$('result').className='result '+(score===blanks.length?'good':'bad')};render();
</script>
</body>
</html>
